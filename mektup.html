<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Kişiye özel, geçici bir sayfa: arama motorlarına girmesin. -->
    <meta name="robots" content="noindex, nofollow">
    <title>Bir Dostundan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Instrument+Serif:ital@0;1&display=swap">
    <link rel="stylesheet" href="mektup.css?v=3">
</head>
<body class="sayfa-mektup">

    <svg class="cicek-kasa" aria-hidden="true" focusable="false" width="0" height="0">
      <defs>
      <g id="m-gul">
        <path d="M0.0,-31.0 A16.1,16.1 0 0 1 24.2,-19.3 A16.1,16.1 0 0 1 30.2,6.9 A16.1,16.1 0 0 1 13.5,27.9 A16.1,16.1 0 0 1 -13.5,27.9 A16.1,16.1 0 0 1 -30.2,6.9 A16.1,16.1 0 0 1 -24.2,-19.3 A16.1,16.1 0 0 1 0.0,-31.0 Z" fill="#f0dcd8" stroke="#c58f8a" stroke-width="1.8" stroke-linejoin="round"/>
        <path d="M0.0,-21.0 A12.2,12.2 0 0 1 18.2,-10.5 A12.2,12.2 0 0 1 18.2,10.5 A12.2,12.2 0 0 1 0.0,21.0 A12.2,12.2 0 0 1 -18.2,10.5 A12.2,12.2 0 0 1 -18.2,-10.5 A12.2,12.2 0 0 1 0.0,-21.0 Z" fill="none" stroke="#c58f8a" stroke-width="1.5" transform="rotate(26)"/>
        <g fill="none" stroke="#c58f8a" stroke-width="1.7" stroke-linecap="round">
          <path d="M11,-6 C5,-13 -5,-13 -10,-7 C-15,-1 -13,8 -6,11 C1,14 9,10 11,3"/>
          <path d="M5,-2 C1,-6 -4,-4 -5,0 C-6,4 -3,7 1,6"/>
        </g>
      </g>
      <g id="m-papatya">
        <g fill="#f6e6df" stroke="#c9a29a" stroke-width="1.8" stroke-linejoin="round">
          <path d="M0,-11 C9,-21.15 9.9,-28.799999999999997 0,-40 C-9.9,-28.799999999999997 -9,-21.15 0,-11 Z" transform="rotate(0)"/>
          <path d="M0,-11 C9,-21.15 9.9,-28.799999999999997 0,-40 C-9.9,-28.799999999999997 -9,-21.15 0,-11 Z" transform="rotate(45)"/>
          <path d="M0,-11 C9,-21.15 9.9,-28.799999999999997 0,-40 C-9.9,-28.799999999999997 -9,-21.15 0,-11 Z" transform="rotate(90)"/>
          <path d="M0,-11 C9,-21.15 9.9,-28.799999999999997 0,-40 C-9.9,-28.799999999999997 -9,-21.15 0,-11 Z" transform="rotate(135)"/>
          <path d="M0,-11 C9,-21.15 9.9,-28.799999999999997 0,-40 C-9.9,-28.799999999999997 -9,-21.15 0,-11 Z" transform="rotate(180)"/>
          <path d="M0,-11 C9,-21.15 9.9,-28.799999999999997 0,-40 C-9.9,-28.799999999999997 -9,-21.15 0,-11 Z" transform="rotate(225)"/>
          <path d="M0,-11 C9,-21.15 9.9,-28.799999999999997 0,-40 C-9.9,-28.799999999999997 -9,-21.15 0,-11 Z" transform="rotate(270)"/>
          <path d="M0,-11 C9,-21.15 9.9,-28.799999999999997 0,-40 C-9.9,-28.799999999999997 -9,-21.15 0,-11 Z" transform="rotate(315)"/>
        </g>
        <circle r="9" fill="#c9a29a" fill-opacity="0.55" stroke="#c9a29a" stroke-width="1.8"/>
        <circle r="5" fill="none" stroke="#c9a29a" stroke-width="1.2" stroke-dasharray="2 3"/>
      </g>
      <g id="m-gonca">
        <path d="M0,0 C-13,-7 -14,-25 0,-34 C14,-25 13,-7 0,0 Z" fill="#f0dcd8" stroke="#c58f8a" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M0,-3 C-5,-12 -5,-24 0,-31" fill="none" stroke="#c58f8a" stroke-width="1.2"/>
        <path d="M0,0 C1,10 1,20 0,28" fill="none" stroke="#9aab93" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M0,9 C-9,8 -15,14 -16,22 C-7,23 -1,18 0,11 Z" fill="#dde5d7" stroke="#9aab93" stroke-width="1.4" stroke-linejoin="round"/>
      </g>
      <g id="m-yaprak">
        <path d="M0,0 C11,-9 26,-9 36,0 C26,9 11,9 0,0 Z" fill="#dde5d7" stroke="#9aab93" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M2,0 L33,0" fill="none" stroke="#9aab93" stroke-width="1.1"/>
      </g>
      <g id="m-dal">
        <path d="M0,0 C12,-26 14,-56 4,-84" fill="none" stroke="#9aab93" stroke-width="1.8" stroke-linecap="round"/>
        <ellipse cx="10" cy="0" rx="11" ry="8" transform="translate(5,-13) rotate(-32) scale(1,1)" fill="#dde5d7" stroke="#9aab93" stroke-width="1.5"/>
        <ellipse cx="11" cy="0" rx="12" ry="9" transform="translate(9,-28) rotate(32) scale(-1,1)" fill="#dde5d7" stroke="#9aab93" stroke-width="1.5"/>
        <ellipse cx="10" cy="0" rx="11" ry="8" transform="translate(10,-43) rotate(-32) scale(1,1)" fill="#dde5d7" stroke="#9aab93" stroke-width="1.5"/>
        <ellipse cx="10" cy="0" rx="10" ry="7" transform="translate(10,-58) rotate(32) scale(-1,1)" fill="#dde5d7" stroke="#9aab93" stroke-width="1.5"/>
        <ellipse cx="8" cy="0" rx="8" ry="6" transform="translate(7,-73) rotate(-32) scale(1,1)" fill="#dde5d7" stroke="#9aab93" stroke-width="1.5"/>
      </g>
      </defs>
    </svg>

    <!-- 1. Perde: zarf -->
    <div class="sahne" id="sahne">
        <button class="zarf" id="zarf" type="button" aria-label="Zarfı aç">
            <span class="zarf-govde"></span>
            <span class="zarf-on"></span>
            <span class="zarf-kapak"></span>
            <span class="muhur" aria-hidden="true">
                <svg viewBox="-34 -34 68 68" class="muhur-cicek"><use href="#m-gul"/></svg>
            </span>
        </button>

        <p class="ipucu" id="ipucu">Zarfa dokun</p>
    </div>

    <!-- Zarftan fışkıran çiçekler; kutuları JS dolduruyor -->
    <div class="cicek-yagmuri" id="cicekYagmuri" aria-hidden="true"></div>

    <!-- 2. Perde: çağrı düğmesi -->
    <div class="cagri" id="cagri" hidden>
        <p class="cagri-ust">Sana bir şey bıraktılar</p>
        <button class="cagri-dugme" id="notuOku" type="button">
            Dostundan gelen notu oku :)
        </button>
    </div>

    <!-- 3. Perde: nostaljik mektup -->
    <main class="mektup" id="mektup" hidden>
        <article class="kagit">
            <div class="kagit-ust" aria-hidden="true">
                <svg viewBox="-4 -14 44 28" class="sus-yaprak sus-sol"><use href="#m-yaprak"/></svg>
                <svg viewBox="-34 -34 68 68" class="sus-gul"><use href="#m-gul"/></svg>
                <svg viewBox="-4 -14 44 28" class="sus-yaprak"><use href="#m-yaprak"/></svg>
            </div>

            <!-- ============================================================
                 NOTU BURAYA YAZ. Her satır bir <p class="satir">.
                 Hitap, imza ve tarih de aşağıda; istediğin gibi değiştir.
                 ============================================================ -->
            <p class="hitap">Sevgili dostum,</p>

            <div class="govde">
                <p class="satir">Bu sayfa senin için yapıldı.</p>
                <p class="satir">Buraya yazılacak notun yerini tutuyor bu satırlar;
                   gerçek metin gelince hepsi değişecek.</p>
                <p class="satir">Arkada çalan parça da senin için seçildi.</p>
            </div>

            <p class="imza">— Dostun</p>
            <p class="tarih">2026</p>
            <!-- ============================================================ -->
        </article>
    </main>

    <!-- Müzik: ekran dışındaki YouTube oynatıcı + sessize alma düğmesi.
         Sarmalayıcı şart: API, içteki div'i iframe ile değiştirirken class'ını
         atıyor; stil dışarıda durmazsa oynatıcı sayfayı 390 piksel uzatıyor. -->
    <div class="muzik-kutu" aria-hidden="true">
        <div id="muzikCerceve"></div>
    </div>

    <button class="muzik-dugme" id="muzikDugme" type="button" hidden
            aria-label="Müziği sessize al" title="Müziği sessize al">
        <svg class="muzik-ikon" id="sesAcik" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z" fill="currentColor"/>
            <path d="M15.6 9a4 4 0 0 1 0 6M18.2 6.6a7.5 7.5 0 0 1 0 10.8"
                  fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
        <svg class="muzik-ikon gizli" id="sesKapali" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9.5h3.2L12 5.6v12.8L7.2 14.5H4z" fill="currentColor"/>
            <path d="M16 9.5l5 5M21 9.5l-5 5"
                  fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
        </svg>
    </button>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="mektup.js?v=2"></script>
</body>
</html>
