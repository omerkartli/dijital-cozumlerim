<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Etkinlik Galerisi - Dijital Çözümlerim</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap">
    <link rel="stylesheet" href="style.css?v=28">
</head>
<body class="sayfa-etkinlik">
    <header class="site-bar">
        <a href="index.html" class="marka">Dijital Çözümlerim</a>
        <nav class="site-nav">
            <a href="https://wa.me/905545520912?text=Merhaba%20dijital%20%C3%BCr%C3%BCnler%20hakk%C4%B1nda%20bilgi%20almak%20istiyorum"
               target="_blank" rel="noopener" class="pill pill-wa">WhatsApp</a>
        </nav>
    </header>

    <section class="etkinlik-bas">
        <h1 id="eventTitle">Etkinlik</h1>
        <p class="etkinlik-durum" id="eventStatus">Yükleniyor...</p>

        <div class="bas-dugmeler">
            <button type="button" class="galeri-dugme" id="galeriDugme" hidden>
                <span id="galeriDugmeMetin">Paylaşılan Fotoğrafları Gör</span>
                <span class="galeri-dugme-ok" aria-hidden="true">&darr;</span>
            </button>

            <a class="galeri-dugme galeri-dugme-alt galeri-dugme-ikincil" id="notlarLink" href="notlar.html">
                <span>Anı Defterini Aç</span>
                <span class="galeri-dugme-ok" aria-hidden="true">&rarr;</span>
            </a>
        </div>

        <form id="uploadForm" class="yukleme">
            <label class="yukleme-alan" for="photoInput" id="dropZone">
                <span class="yukleme-ikon" aria-hidden="true">+</span>
                <span class="yukleme-metin" id="dosyaAdi">Fotoğraf Seç veya Buraya Sürükle</span>
                <input
                    type="file"
                    id="photoInput"
                    accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
                    multiple
                >
            </label>

            <label class="kamera-dugme" for="kameraInput" id="kameraAlan" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" class="kamera-ikon"><path d="M9 3 7.5 5H4a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-3.5L15 3z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="12.5" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
                <span>Anlık Fotoğraf Çek</span>
                <input type="file" id="kameraInput" accept="image/*" capture="environment">
            </label>

            <div class="onizleme" id="onizleme" hidden></div>

            <p class="yukleme-uyari" id="sinirUyari" role="status" hidden></p>

            <label class="ozel-secim" for="ozelMi">
                <input type="checkbox" id="ozelMi">
                <span>
                    Sadece etkinlik sahipleri görsün
                    <small>Bu fotoğraf galeride herkese görünmez, yalnızca onlara iletilir.</small>
                </span>
            </label>

            <div class="ozel-secim kvkk-satir">
                <label class="kvkk-etiket" for="kvkkOnay">
                    <input type="checkbox" id="kvkkOnay">
                    <span>Fotoğraflarımın KVKK kapsamında işlenmesine izin veriyorum</span>
                </label>
                <button type="button" class="metin-link" id="kvkkAc">Aydınlatma metnini oku</button>
            </div>

            <div class="yukleme-satir">
                <input type="text" id="uploaderName" placeholder="Nickname" autocomplete="name">
                <button type="submit" class="pill pill-koyu" id="yukleBtn" disabled>Yükle</button>
            </div>
        </form>
        <p id="uploadMessage" class="yukleme-mesaj"></p>

    </section>

    <main class="sahne" id="sahne">
        <div class="sahne-ust">
            <span class="sahne-sayi" id="galeriSayi"></span>
            <div class="sahne-gorunum" role="group" aria-label="Görünüm">
                <button type="button" class="gorunum-btn" id="agacBtn">Ağaç</button>
                <button type="button" class="gorunum-btn" id="kureBtn">Küre</button>
                <button type="button" class="gorunum-btn is-secili" id="izgaraBtn">Izgara</button>
            </div>
        </div>

        <div class="agac-alan" id="agacAlan" hidden>
            <svg class="agac-dallar" id="agacDallar" aria-hidden="true"></svg>
            <div class="agac-meyveler" id="agacMeyveler"></div>
        </div>

        <div class="kure-alan" id="kureAlan" hidden>
            <div class="kure" id="kure"></div>
        </div>

        <p class="sahne-ipucu" id="sahneIpucu">Döndürmek için sürükle &middot; Büyütmek için dokun</p>

        <div class="izgara" id="izgara"></div>

        <div class="sahne-alt">
            <button type="button" class="gorunum-btn daha-fazla" id="dahaFazla" hidden></button>
        </div>

        <p class="sahne-durum" id="galeriDurum"></p>
    </main>

    <footer class="site-alt">
        <p class="site-alt-yazi">Ürünler ve bilgi için</p>
        <div class="site-alt-dugmeler">
            <a href="https://wa.me/905545520912?text=Merhaba%20dijital%20%C3%BCr%C3%BCnler%20hakk%C4%B1nda%20bilgi%20almak%20istiyorum"
               target="_blank" rel="noopener" class="pill pill-wa">
                <svg class="wa-ikon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.46 1.32 4.96L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22c5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01A9.82 9.82 0 0 0 12.04 2zm0 1.84c2.16 0 4.19.84 5.71 2.37a8.03 8.03 0 0 1 2.37 5.71c0 4.45-3.63 8.07-8.08 8.07a8.07 8.07 0 0 1-4.11-1.13l-.29-.17-3.05.8.81-2.97-.19-.31a8.02 8.02 0 0 1-1.23-4.29c0-4.45 3.62-8.08 8.06-8.08z"/><path fill="currentColor" d="M17.47 14.38c-.3-.15-1.76-.87-2.03-.97-.27-.1-.47-.15-.67.15-.2.3-.77.97-.94 1.17-.17.2-.35.22-.65.07-.3-.15-1.26-.46-2.4-1.48-.89-.79-1.49-1.77-1.66-2.07-.17-.3-.02-.46.13-.61.14-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.07-.15-.67-1.61-.92-2.21-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48 0 1.46 1.06 2.87 1.21 3.07.15.2 2.09 3.2 5.07 4.49.71.31 1.26.49 1.69.63.71.23 1.36.19 1.87.12.57-.09 1.76-.72 2.01-1.41.25-.69.25-1.28.17-1.41-.07-.13-.27-.2-.57-.35z"/></svg>
                <span>WhatsApp</span>
            </a>
            <a href="index.html" class="pill pill-ana">Dijital Çözümlerim</a>
        </div>
    </footer>

    <div class="lightbox" id="lightbox" hidden>
        <button type="button" class="lb-kapat" id="lbKapat" aria-label="Kapat">&times;</button>
        <button type="button" class="lb-ok lb-onceki" id="lbOnceki" aria-label="Önceki fotoğraf">&lsaquo;</button>
        <figure class="lb-icerik">
            <img id="lbGorsel" alt="Etkinlik fotoğrafı"
                 src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7">
            <figcaption class="lb-sayac" id="lbSayac"></figcaption>
        </figure>
        <button type="button" class="lb-ok lb-sonraki" id="lbSonraki" aria-label="Sonraki fotoğraf">&rsaquo;</button>
    </div>

    <script src="script.js?v=7"></script>
    <script src="kvkk.js?v=1"></script>
    <script src="gallery.js?v=23"></script>
</body>
</html>
